<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Panora Raf Asistanı</title>
<meta name="panora-version" content="35">
<style>
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#141C2E; --muted:#5A6478; --line:#DCE1EA;
  --accent:#FFC629; --accent-ink:#141C2E; --navy:#1C2A4A; --good:#147A4B; --good-bg:#E3F4EA; --warn:#9A5B00; --warn-bg:#FFF2D6;
  --no:#7C8598; --no-bg:#ECEFF4; --chip:#E8ECF4; --diff:#FFF6D9;
  --f-display:"sans-serif-condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Roboto Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0D1220; --surface:#161D2F; --ink:#E9EDF5; --muted:#9AA4B8; --line:#2A3350;
  --navy:#1A2440; --good:#5FD39A; --good-bg:#14342A; --warn:#FFC867; --warn-bg:#3A2C10;
  --no:#7D879C; --no-bg:#1E2638; --chip:#222B42; --diff:#2E2A16; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px)}
.top{background:var(--navy);color:#fff;padding:12px 16px}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;opacity:.75}
.tag{background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-size:12px;padding:4px 8px 4px 12px;border-radius:3px;
  clip-path:polygon(8px 0,100% 0,100% 100%,8px 100%,0 50%);white-space:nowrap}
main{max-width:640px;margin:0 auto;padding:0 16px calc(90px + env(safe-area-inset-bottom,0px))}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.15;margin:0}
h3{font-family:var(--f-display);font-weight:700;font-size:13px;margin:0;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
input[type=search],input[type=text]{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px}
input:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px;border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;font-size:15px;border:0;border-radius:10px;padding:11px 14px;cursor:pointer;min-height:44px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-dark{background:var(--navy);color:#fff}
.btn-ghost{background:var(--chip);color:var(--ink)}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 auto}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--chip);color:var(--ink);border:0;border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
/* search */
.searchbar{position:sticky;top:0;z-index:4;background:var(--bg);padding:12px 16px 10px;margin:0 -16px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.sbox{position:relative}
.sbox input{padding-left:42px;padding-right:44px}
.sbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2}
.sbox .clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:24px;width:40px;height:40px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.meta b{color:var(--ink)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink)}
.switch input{appearance:none;-webkit-appearance:none;width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--good)}
.switch input:checked::after{left:19px}
.results{display:grid;gap:8px;padding-top:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item.hide{display:none}
.item>button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;width:100%}
.item .nm{font-weight:600;font-size:15px;line-height:1.3;min-width:0}
.item .nm mark{background:none;color:inherit;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:2px}
.item .ct{grid-column:1;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .side{grid-column:2;grid-row:1 / span 2;display:grid;justify-items:end;align-content:start;gap:5px}
.price{font-family:var(--f-mono);font-size:14px;white-space:nowrap}
.price s{color:var(--muted);font-size:11px;display:block;text-align:right}
.price .web{display:block;text-align:right;font-family:var(--f-body);font-size:10.5px;color:var(--warn);font-weight:600}
.st{font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;white-space:nowrap}
.st.in{background:var(--good-bg);color:var(--good)}
.st.low{background:var(--warn-bg);color:var(--warn)}
.st.no{background:var(--no-bg);color:var(--no)}
.st.wait{background:var(--chip);color:var(--muted)}
.st.err{background:var(--no-bg);color:var(--warn)}
.more{border-top:1px solid var(--line);padding:12px 14px;display:grid;gap:10px}
.more .btn{min-height:40px;font-size:14px}
.code{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.specs{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.specs dt{color:var(--muted)} .specs dd{margin:0;font-weight:500}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:20px;color:var(--muted);display:grid;gap:6px;margin-top:12px}
.empty strong{color:var(--ink)}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:14px 4px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--ink);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.showmore{margin-top:8px;width:100%}
/* compare */
.pad{display:grid;gap:16px;padding-top:16px}
.slots{display:grid;gap:8px}
.slot{display:grid;grid-template-columns:28px 1fr 40px;gap:10px;align-items:center;background:var(--bg);border-radius:10px;padding:8px}
.slot .n{width:28px;height:28px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700;display:grid;place-items:center}
.slot .t{font-size:14px;font-weight:600;line-height:1.3}
.slot .t small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.slot button{border:0;background:var(--chip);color:var(--ink);width:40px;height:40px;border-radius:10px;font-size:18px}
.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;vertical-align:top;padding:9px 8px;border-bottom:1px solid var(--line)}
thead th{font-family:var(--f-display);font-weight:700;font-size:13px;position:sticky;top:0;background:var(--surface)}
tbody th{font-weight:500;color:var(--muted);font-size:12.5px;min-width:110px;width:30%}
td{min-width:105px}
tr.d td{background:var(--diff)}
td.win{color:var(--good);font-weight:700}
td.win::after{content:" ▲";font-size:10px}
tr.ours th{color:var(--ink);font-weight:600}
tr.sec th{background:var(--bg);color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px}
.hist{display:grid;gap:8px}
.hist button{all:unset;display:flex;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px}
.hist small{color:var(--muted);white-space:nowrap;font-family:var(--f-mono);font-size:12px}
.pitch{background:var(--navy);color:#fff;border-radius:14px;padding:16px;display:grid;gap:10px}
.pitch h3{color:var(--accent)}
.pitch p{font-size:16px;line-height:1.55}
.pitch .btn{background:rgba(255,255,255,.14);color:#fff;min-height:40px;padding:8px 14px;font-size:14px;justify-self:start}
ul.diffs{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr}
.tab{all:unset;display:grid;justify-items:center;gap:2px;padding:9px 0 11px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab .badge{position:absolute;top:5px;left:calc(50% + 10px);background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-size:10px;border-radius:999px;padding:0 5px;line-height:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:9;max-width:90vw;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">Panora Raf Asistanı<small>Ankara Panora Extra · Kat −2</small></div>
    <button class="tag" id="verTag" type="button" style="border:0;font:inherit;font-family:var(--f-mono);font-size:12px">canlı stok</button>
  </div>
</header>

<main>
  <section id="view-ara">
    <div class="searchbar">
      <div class="sbox">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input type="text" id="q" placeholder="iphone 15, dyson v15, oled 55…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <button class="clr" id="clr" type="button" aria-label="Temizle" hidden>×</button>
      </div>
      <div class="meta">
        <label class="switch"><input type="checkbox" id="onlyIn"> Sadece Panora'da olanlar</label>
        <span id="count"></span>
      </div>
      <div class="chips" id="recent"></div>
    </div>
    <div class="results" id="results"></div>
    <button class="btn btn-ghost showmore" id="more" type="button" hidden>Daha fazla ürün yükle</button>
  </section>

  <section id="view-kiyas" hidden>
    <div class="pad">
      <h2>Karşılaştır</h2>
      <div class="panel">
        <div class="slots" id="slots"></div>
        <p class="muted" id="slotHint" style="font-size:14px">Ara sekmesinde ürüne dokunup <b>Kıyasa ekle</b> de. En fazla 3 ürün.</p>
        <div class="row">
          <button class="btn btn-dark" id="go" type="button">Özellikleri karşılaştır</button>
        </div>
        <label class="switch"><input type="checkbox" id="onlyDiff" checked> Sadece farklı olanları göster</label>
      </div>
      <div id="result"></div>
      <div id="histWrap" hidden>
        <h3 style="margin-bottom:8px">Önceki kıyaslar</h3>
        <div class="hist" id="hist"></div>
      </div>
    </div>
  </section>
</main>

<nav class="tabs">
  <div class="tabs-in">
    <button class="tab" id="tab-ara" aria-selected="true">
      <svg viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9M3 9h18M3 9v11h18V9M9 20v-6h6v6"/></svg>Ara · Stok
    </button>
    <button class="tab" id="tab-kiyas" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M12 3v18M5 7h4M5 7l-2.5 6a3 3 0 0 0 5 0L5 7zM19 7h-4M19 7l-2.5 6a3 3 0 0 0 5 0L19 7zM8 21h8"/></svg>Karşılaştır<span class="badge" id="cmpBadge" hidden></span>
    </button>
  </div>
</nav>
<div class="toast" id="toast" hidden></div>
<div id="sheet" hidden style="position:fixed;inset:0;z-index:20;background:rgba(10,15,30,.45);display:flex;align-items:flex-end">
  <div class="panel" style="width:100%;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))">
    <h3>Uygulama</h3>
    <p id="verInfo" style="font-size:15px"></p>
    <p class="muted" style="font-size:13px">Yeni sürümler GitHub’daki panora-raf deposundan otomatik indirilir; uygulama açılınca kontrol edilir.</p>
    <h3 style="margin-top:6px">Yapay zekâ (Google Gemini)</h3>
    <p class="muted" style="font-size:13px" id="aiState"></p>
    <input type="password" id="aiKey" placeholder="Gemini API anahtarını yapıştır" autocomplete="off" spellcheck="false" style="font-size:15px">
    <div class="row"><button class="btn btn-dark" id="aiSave" type="button">Anahtarı kaydet ve dene</button><button class="btn btn-ghost" id="aiDel" type="button">Sil</button></div>
    <div class="row"><button class="btn btn-primary" id="chkUpd" type="button">Güncellemeleri kontrol et</button><button class="btn btn-ghost" id="closeSheet" type="button">Kapat</button></div>
    <button class="btn btn-ghost" id="resetUpd" type="button" style="font-size:13px;min-height:36px">İndirilen sürümü sil (APK’daki sürüme dön)</button>
  </div>
</div>

<script>
(function(){
const STORE_CODE='4133', CITY='06', TOWN='6079';
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('pra_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('pra_'+k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TL=n=>n?Math.round(n).toLocaleString('tr-TR')+' ₺':'';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2000)}
const norm=s=>String(s||'').toLocaleLowerCase('tr-TR').replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c').replace(/[^a-z0-9.+]+/g,' ').trim();
const ST={inStock:['in','Stokta var'],lowStock:['low','Az kaldı'],none:['no','Stokta yok'],wait:['wait','stok…'],err:['err','bakılamadı']};
const csrf=()=>{try{return (window.ACC&&ACC.config&&ACC.config.CSRFToken)||''}catch(e){return ''}};

/* ---------- Teknosa access ---------- */
let warm=null;
function warmUp(){ // loads a real teknosa page once in a hidden iframe so the site's cookies are set
  if(warm)return warm;
  warm=new Promise(res=>{const f=document.createElement('iframe');f.style.cssText='position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0';
    f.src='/magaza-bul';f.onload=()=>{setTimeout(()=>{try{const t=f.contentWindow.ACC&&f.contentWindow.ACC.config&&f.contentWindow.ACC.config.CSRFToken;if(t)window.__csrf=t}catch(e){}res()},400)};
    setTimeout(res,8000);document.body.appendChild(f)});
  return warm;
}
let cooldownUntil=0,cdHits=0;
// keep well under Teknosa's limit: at most 30 requests per rolling minute, at least 250 ms apart
const sent=[];let lastSent=0;
async function slot(){
  for(;;){const now=Date.now();while(sent.length&&now-sent[0]>60000)sent.shift();
    const wait=Math.max(cooldownUntil-now,sent.length>=30?60000-(now-sent[0]):0,lastSent+250-now);
    if(wait<=0){sent.push(now);lastSent=now;return}await sleep(Math.min(wait,1000))}
}
async function tk(url,opt={},tries=2){
  for(let i=0;i<tries;i++){
    await slot();if(opt.signal&&opt.signal.aborted)throw new DOMException('aborted','AbortError');
    let r;try{r=await fetch(url,opt)}catch(e){if(opt.signal&&opt.signal.aborted)throw e;await sleep(600);continue}
    if(r.status===429){cdHits++;const secs=Math.min(120,20*cdHits);cooldownUntil=Date.now()+secs*1000;toast(`Teknosa yavaşlamamızı istedi, ${secs} sn sonra kendiliğinden devam edecek`);setTimeout(pumpStock,secs*1000+200);throw new Error('429')}
    cdHits=Math.max(0,cdHits-0.1);
    if(r.status===403&&i===0){await csrfToken(true);continue}
    if(r.ok)return r;
    await sleep(500);
  }
  throw new Error('fail');
}
const searchCache=new Map();
// English / everyday words -> the Turkish terms Teknosa uses in product names and categories
const SYN={printer:'yazıcı',yazici:'yazıcı',scanner:'tarayıcı',laptop:'laptop',notebook:'laptop',dizustu:'laptop',headphone:'kulaklık',headphones:'kulaklık',headset:'kulaklık',earbuds:'kulaklık',earphone:'kulaklık',kulaklik:'kulaklık',
  speaker:'hoparlör',hoparlor:'hoparlör',keyboard:'klavye',monitor:'monitör',phone:'telefon',smartphone:'telefon',watch:'akıllı saat',smartwatch:'akıllı saat',saat:'akıllı saat',
  tv:'televizyon',television:'televizyon',vacuum:'süpürge',supurge:'süpürge',fridge:'buzdolabı',refrigerator:'buzdolabı',buzdolabi:'buzdolabı',washer:'çamaşır makinesi',dishwasher:'bulaşık makinesi',
  charger:'şarj aleti',sarj:'şarj',cable:'kablo',case:'kılıf',kilif:'kılıf',camera:'fotoğraf makinesi',console:'oyun konsolu',konsol:'oyun konsolu',coffee:'kahve makinesi',iron:'ütü',utu:'ütü',
  dryer:'kurutma',hairdryer:'saç kurutma',router:'modem',modem:'modem',powerbank:'powerbank',tablet:'tablet',mouse:'mouse',klavye:'klavye'};
function expandQuery(t){
  const words=t.trim().split(/\s+/);let changed=false;
  const out=words.map(w=>{const k=norm(w);const r=SYN[k];if(r&&norm(r)!==k){changed=true;return r}return w});
  return {q:out.join(' '),changed};
}
async function teknosaSearch(term,page,signal){
  const key=term+'|'+page;if(searchCache.has(key))return searchCache.get(key);
  let a={items:[],total:0},b={items:[],total:0},err=null;
  try{a=await parseSearch(term+':relevance:seller:teknosa',page,signal)}catch(e){err=e}
  // new models (e.g. iPhone 18) are often missing from the seller filter: widen only when the filtered list is thin
  if(a.items.length<10){try{b=await parseSearch(term,page,signal)}catch(e){if(err)throw err}}
  const seen=new Set(),items=[];[...a.items,...b.items].forEach(x=>{if(!seen.has(x.id)){seen.add(x.id);items.push(x)}});
  const res={items,total:Math.max(a.total,b.total)};searchCache.set(key,res);return res;
}
async function parseSearch(qs,page,signal){
  // Teknosa's JSON search (~5x smaller than the HTML page); every result lists all sellers' offers
  const r=await tk('/search/results?q='+encodeURIComponent(qs)+(page?'&page='+page:''),{signal,headers:{'X-Requested-With':'XMLHttpRequest','Accept':'application/json'}});
  const j=await r.json();
  const items=(j.results||[]).map(r=>{
    const struct=String(r.categoryNameStructure||'').split('>').map(s=>s.trim()).filter(s=>s&&s!=='Kategoriler');
    const off=(r.availablePrices||[]).find(a=>!a.shopId&&!a.shopUrl); // the TEKNOSA offer has no marketplace shop
    const p=off?Math.round(Math.max(+off.priceValue||0,+off.wasPriceValue||0)):0; // normal price, web discount removed
    return {id:String(r.code||''),n:r.name||'',b:r.brandCategoryName||'',c:struct.join(' > '),leaf:struct[struct.length-1]||r.subCatName||'',p,o:0,tk:!!off,oos:!!(off&&off.isOutOfStock===true),
      u:String(r.url||'').split('?')[0]+'?shopId=teknosa'};
  }).filter(x=>x.id);
  // Teknosa's own offer marked out of stock -> treat as not in the store (no store query)
  items.forEach(x=>{if(!x.tk){x.nt=true;x.st='none'}else if(x.oos){x.st='none'}});

const AI={
  key(){try{return localStorage.getItem('pra_gkey')||''}catch(e){return ''}},
  setKey(k){try{k?localStorage.setItem('pra_gkey',k):localStorage.removeItem('pra_gkey');localStorage.removeItem('pra_gmodels');localStorage.removeItem('pra_gmodel')}catch(e){}},
  // all text models this key can use, best first: stable "flash" models, then "flash-lite", then others
  async models(){
    try{const c=JSON.parse(localStorage.getItem('pra_gmodels')||'null');if(c&&Date.now()-c.at<24*3600e3&&c.list.length)return c.list}catch(e){}
    const r=await fetchT('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':this.key()}},20000);
    if(!r.ok)throw await aiErr(r);
    const j=await r.json();
    const ok=(j.models||[]).filter(x=>(x.supportedGenerationMethods||[]).includes('generateContent')).map(x=>x.name.replace(/^models\//,'')).filter(n=>/^gemini/.test(n)&&!/image|tts|audio|live|embed|vision|robotics|computer/.test(n));
    const ver=n=>parseFloat((n.match(/gemini-(\d+(\.\d+)?)/)||[])[1])||0;
    const score=n=>(/flash/.test(n)?100:0)+(/lite/.test(n)?-8:0)+(/preview|exp/.test(n)?-40:0)+(/pro/.test(n)?-20:0)+ver(n)*3+(/latest/.test(n)?-1:0);
    const list=[...new Set(ok)].sort((a,b)=>score(b)-score(a)).slice(0,6);
    if(!list.length)throw new Error('Bu anahtarla kullanılabilen model bulunamadı.');
    try{localStorage.setItem('pra_gmodels',JSON.stringify({at:Date.now(),list}))}catch(e){}
    return list;
  },
  async model(){const l=await this.models();let m='';try{m=localStorage.getItem('pra_gmodel')||''}catch(e){}return l.includes(m)?m:l[0]},
  async ask(prompt,onStatus){
    if(!this.key())throw new Error('nokey');
    const list=await this.models();let pref='';try{pref=localStorage.getItem('pra_gmodel')||''}catch(e){}
    const order=[...new Set([pref,...list].filter(m=>m&&list.includes(m)))];
    let last=null;
    for(let i=0;i<Math.min(order.length,4);i++){
      const m=order[i];if(i&&onStatus)onStatus(`Yoğunluk var, başka modelle deneniyor (${m})…`);
      for(const thinkOff of [true,false]){
        const gc={temperature:0.5,maxOutputTokens:1400};if(thinkOff&&/2\.5-flash/.test(m))gc.thinkingConfig={thinkingBudget:0};
        let r;

          headers:{'x-goog-api-key':this.key(),'Content-Type':'application/json'},
          body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:gc})},45000)}
        catch(e){last=new Error(e.name==='AbortError'?'Yapay zekâ 45 saniyede cevap vermedi.':'Yapay zekâya bağlanılamadı. İnternetini kontrol et.');break}
        if(r.ok){const j=await r.json();const t=((((j.candidates||[])[0]||{}).content||{}).parts||[]).filter(p=>!p.thought).map(p=>p.text||'').join('').trim();
          if(t){try{localStorage.setItem('pra_gmodel',m)}catch(e){}return t}last=new Error('Yapay zekâ boş cevap döndü, tekrar dene.');break}
        if(r.status===400&&gc.thinkingConfig){continue} // model rejects the thinking setting: retry without it
        last=await aiErr(r);
        if(r.status===400||r.status===403)throw last; // bad key: other models won't help
        break; // 429/500/503/404: try the next model
      }
      await sleep(800);
    }
    throw last||new Error('Yapay zekâya ulaşılamadı.');
  }

function fetchT(url,opt,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(url,Object.assign({},opt,{signal:c.signal})).finally(()=>clearTimeout(t))}
async function aiErr(r){
  let msg='';try{msg=((await r.json()).error||{}).message||''}catch(e){}
  if(r.status===400&&/key/i.test(msg))return new Error('API anahtarı geçersiz. Ayarlardan kontrol et.');
  if(r.status===403)return new Error('Bu anahtarın Gemini’ye erişimi yok. Ayarlardan kontrol et.');
  if(r.status===429)return new Error('Gemini’nin ücretsiz kullanım sınırı doldu. Biraz sonra (günlük sınırsa yarın) tekrar dene.');

}

function snum(k,v){
  const t=String(v);if(/\d\s*[x×]\s*\d/.test(t))return NaN;
  const m=t.replace(/\.(?=\d{3}\b)/g,'').replace(',','.').match(/-?\d+(\.\d+)?/);if(!m)return NaN;
  let n=parseFloat(m[0]);if(/\btb\b/i.test(t))n*=1024;return n;
}
function shortName(n,b){
  let t=String(n).replace(new RegExp('^'+(b||'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*','i'),'')
    .replace(/akıllı telefon|cep telefonu|akıllı saat|dizüstü bilgisayar|bilgisayar|televizyon|şarjlı|dikey|süpürge|akıllı|telefon/gi,'').replace(/\s+/g,' ').trim();
  return t.split(' ').slice(0,4).join(' ')||n;
}
function talkTrack(prods,specs,stocks){
  const N=prods.map(p=>shortName(p.n,(p.n||'').split(' ')[0]));
  const adv=prods.map(()=>[]),who=prods.map(()=>[]);const facts=[];
  const keys=[];const seen=new Set();specs.forEach(sp=>sp.forEach(x=>{if(!seen.has(x.k)){seen.add(x.k);keys.push(x.k)}}));
  const val=(i,k)=>{const f=specs[i].find(x=>x.k===k);return f?f.v:''};
  const used=new Set();
  RULES.forEach(r=>{
    const k=keys.find(k=>r.re.test(k.toLocaleLowerCase('tr-TR'))&&!used.has(k));if(!k)return;used.add(k);
    const vals=prods.map((_,i)=>val(i,k));if(vals.some(v=>!v))return;
    if(vals.every(v=>norm(v)===norm(vals[0])))return;
    if(r.kind==='text'){facts.push(`${r.lbl[0].toLocaleUpperCase('tr-TR')+r.lbl.slice(1)}: ${vals.map((v,i)=>`${N[i]} ${v}`).join(', ')}.`);return}
    const ns=vals.map(v=>snum(k,v));if(ns.some(isNaN))return;
    const best=r.kind==='hi'?Math.max(...ns):Math.min(...ns);if(ns.filter(n=>n===best).length!==1)return;
    const i=ns.indexOf(best);adv[i].push(`${r.adv} (${vals[i]}${prods.length===2?` – diğerinde ${vals[1-i]}`:''})`);if(r.who)who[i].push(r.who);
  });
  // yes/no features
  let yn=0;keys.forEach(k=>{if(used.has(k)||yn>=3)return;const vals=prods.map((_,i)=>val(i,k));
    if(vals.every(v=>/^(evet|var|mevcut)$/i.test(v)||/^(hayır|yok)$/i.test(v))&&!vals.every(v=>norm(v)===norm(vals[0]))){
      vals.forEach((v,i)=>{if(/^(evet|var|mevcut)$/i.test(v))adv[i].push(`${k.toLocaleLowerCase('tr-TR')} özelliği`)});yn++}});
  // price
  const prices=prods.map(p=>p.p||0);let cheap=-1,diff=0;
  if(prices.every(Boolean)){const mn=Math.min(...prices);if(prices.filter(x=>x===mn).length===1){cheap=prices.indexOf(mn);diff=Math.max(...prices)-mn;who[cheap].push('bütçesini korumak isteyen')}}
  // spoken summary
  const lines=[];
  if(prods.length===2){
    const ex=cheap===-1?-1:1-cheap;
    if(cheap>=0)lines.push(`${N[cheap]} daha uygun; aradaki fiyat farkı ${TL(diff)}.`);
    if(ex>=0&&adv[ex].length)lines.push(`${N[ex]} bu farkla size ${adv[ex].slice(0,3).map(a=>a.replace(/ \(.*\)$/,'')).join(', ')} sunuyor.`);
    else if(cheap<0&&(adv[0].length||adv[1].length))lines.push(prods.map((_,i)=>adv[i].length?`${N[i]} ${adv[i].slice(0,2).map(a=>a.replace(/ \(.*\)$/,'')).join(' ve ')} ile öne çıkıyor`:'').filter(Boolean).join('; ')+'.');
    if(cheap>=0&&adv[cheap].length)lines.push(`${N[cheap]} ise ${adv[cheap].slice(0,2).map(a=>a.replace(/ \(.*\)$/,'')).join(' ve ')} ile öne çıkıyor.`);
    const w=i=>who[i].filter(x=>x!=='bütçesini korumak isteyen')[0]||who[i][0];
    if(w(0)&&w(1)&&w(0)!==w(1))lines.push(`${w(0)[0].toLocaleUpperCase('tr-TR')+w(0).slice(1)} biri için ${N[0]}, ${w(1)} biri için ${N[1]} daha doğru seçim olur.`);
    else if(ex>=0&&w(ex))lines.push(`${w(ex)[0].toLocaleUpperCase('tr-TR')+w(ex).slice(1)} biriyseniz ${N[ex]}; fiyat önceliğinizse ${N[cheap]} daha mantıklı.`);
  }else{
    if(cheap>=0)lines.push(`En uygun fiyatlı seçenek ${N[cheap]}.`);
    prods.forEach((_,i)=>{if(adv[i].length)lines.push(`${N[i]}: ${adv[i].slice(0,2).map(a=>a.replace(/ \(.*\)$/,'')).join(', ')}.`)});
  }
  if(!lines.length)lines.push('Teknosa’nın listelediği özelliklerde belirgin bir fark yok; renk, tasarım ve fiyat tercihine göre seçilebilir.');
  const stockNote=stocks.map((st,i)=>st==='none'?`${N[i]} şu an Panora’da yok.`:'').filter(Boolean).join(' ');
  const say=lines.join(' ');
  return `<div class="pitch"><h3>Müşteriye şöyle anlatabilirsin</h3><p id="pitchText">${esc(say)}</p>
    ${stockNote?`<p style="font-size:14px;opacity:.85">Not: ${esc(stockNote)}</p>`:''}
    <button class="btn" id="copyPitch" type="button">Metni kopyala</button></div>
    <div class="panel"><h3>Her ürünün artısı</h3>
    ${prods.map((_,i)=>`<div><b style="font-family:var(--f-display)">${'ABC'[i]} · ${esc(N[i])}</b>${adv[i].length||i===cheap?`<ul class="diffs" style="margin-top:6px">${i===cheap?`<li>daha uygun fiyat (${TL(prices[i])})</li>`:''}${adv[i].map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`:'<p class="muted" style="font-size:14px">Listelenen özelliklerde öne çıkan bir farkı yok.</p>'}</div>`).join('')}
    ${facts.length?`<p class="muted" style="font-size:13px">${facts.map(esc).join(' ')}</p>`:''}
    <p class="muted" style="font-size:12px">Bu metin Teknosa’daki özellik değerlerinden otomatik oluşturuldu; sayısal karşılaştırmadır, her farkın kullanımdaki etkisini müşteriye göre sen yorumla.</p></div>`;
}
function renderCmp({prods,specs,stocks}){
  const L='ABC';const keys=[];const seen=new Set();
  specs.forEach(sp=>sp.forEach(s=>{if(!seen.has(s.k)){seen.add(s.k);keys.push(s.k)}}));
  const val=(i,k)=>{const f=specs[i].find(s=>s.k===k);return f?f.v:''};
  const onlyDiff=$('#onlyDiff').checked;let diffCount=0;
  const rows=keys.map(k=>{
    const vals=prods.map((_,i)=>val(i,k));
    const same=vals.every(v=>norm(v)===norm(vals[0]));if(!same)diffCount++;
    if(onlyDiff&&same)return '';
    let win=-1;
    if(!same&&HIGHER.test(k)){const ns=vals.map(num);if(ns.every(n=>!isNaN(n))){const mx=Math.max(...ns);if(ns.filter(n=>n===mx).length===1)win=ns.indexOf(mx)}}
    return `<tr class="${same?'':'d'}"><th scope="row">${esc(k)}</th>${vals.map((v,i)=>`<td class="${i===win?'win':''}">${esc(v||'—')}</td>`).join('')}</tr>`;
  }).join('');
  const cats=new Set(prods.map(p=>(p.c||'').split(' > ').slice(0,2).join(' > ')));
  const warn=cats.size>1?`<p class="note">Bu ürünler farklı kategorilerde; ortak özellik az olabilir.</p>`:'';
  const ours=`<tr class="ours"><th scope="row">Fiyat</th>${prods.map(p=>`<td>${TL(p.p)}</td>`).join('')}</tr>
    <tr class="ours"><th scope="row">Panora stok</th>${stocks.map(s=>`<td><span class="st ${ST[s][0]}">${ST[s][1]}</span></td>`).join('')}</tr>`;
  $('#result').innerHTML=`<div style="display:grid;gap:16px"><div data-cmpai></div>${talkTrack(prods,specs,stocks)}<div class="panel">${warn}
    <div class="tbl-wrap"><table><thead><tr><th></th>${prods.map((p,i)=>`<th>${L[i]} · ${esc(p.n.length>28?p.n.slice(0,27)+'…':p.n)}</th>`).join('')}</tr></thead>
    <tbody>${ours}${rows||`<tr><td colspan="${prods.length+1}" class="muted">Farklı özellik bulunamadı.</td></tr>`}</tbody></table></div>
    <p class="muted" style="font-size:12px">Değerler Teknosa’nın ürün sayfalarından. ${diffCount} özellik farklı. Sarı satırlar farklı; ▲ sayısal olarak yüksek olan.</p></div></div>`;
  aiBlock($('[data-cmpai]'),'Yapay zekâ değerlendirmesi',()=>cmpPrompt(prods,specs,stocks));
  const cp=$('#copyPitch');if(cp)cp.onclick=async()=>{const t=$('#pitchText').textContent;try{await navigator.clipboard.writeText(t);toast('Kopyalandı')}catch(e){const r=document.createRange();r.selectNodeContents($('#pitchText'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast('Metni seçtim, kopyala')}};
}

async function checkUpdate(manual){

function showUpdate(v){const el=$('#toast');el.innerHTML=`Yeni sürüm hazır (${verText(v)}) · <u>Şimdi yenile</u>`;el.hidden=false;clearTimeout(toast.t);el.onclick=()=>location.reload()}
$('#verTag').textContent='canlı stok · '+verText(myVer);
function aiStateText(){const k=AI.key();let m='';try{m=localStorage.getItem('pra_gmodel')||''}catch(e){}$('#aiState').textContent=k?`Anahtar kayıtlı (…${k.slice(-4)})${m?' · model: '+m:''}.`:'Anahtar yok. aistudio.google.com → Get API key ile ücretsiz alıp buraya yapıştır.';$('#aiKey').value=''}
$('#verTag').onclick=()=>{verInfo();aiStateText();$('#sheet').hidden=false};
$('#aiKey').onkeydown=e=>{if(e.key==='Enter')$('#aiSave').click()};
$('#aiSave').onclick=async()=>{const k=$('#aiKey').value.trim();if(!k){toast('Önce anahtarı yapıştır');return}AI.setKey(k);$('#aiState').textContent='Deneniyor…';
  try{const m=await AI.model();try{localStorage.setItem('pra_gmodel',m)}catch(e){}aiStateText();toast('Yapay zekâ hazır ('+m+')')}catch(e){$('#aiState').textContent=e.message}};
$('#aiDel').onclick=()=>{AI.setKey('');aiStateText();toast('Anahtar silindi')};
$('#closeSheet').onclick=()=>$('#sheet').hidden=true;
$('#sheet').onclick=e=>{if(e.target.id==='sheet')$('#sheet').hidden=true};
$('#chkUpd').onclick=()=>{$('#sheet').hidden=true;checkUpdate(true)};
$('#resetUpd').onclick=()=>{if(N){N.reset();toast('APK’daki sürüme dönülüyor');setTimeout(()=>location.reload(),800)}};
setTimeout(()=>checkUpdate(false),3000);
renderList();
})();
</script>
</body>
</html>
